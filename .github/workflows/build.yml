# Compila el firmware para el M-VAVE FM-1 en cada cambio y deja el instalable como artefacto.
name: Compilar firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias de Python
        run: pip install Pillow fonttools

      - name: Toolchain de JieLi (caché)
        id: tc
        uses: actions/cache@v4
        with:
          path: ~/.jieli
          key: jieli-toolchain-v1

      - name: Descargar toolchain de JieLi
        if: steps.tc.outputs.cache-hit != 'true'
        run: tools/get_toolchain.sh

      - name: SDK AC79 de JieLi (caché)
        id: sdk
        uses: actions/cache@v4
        with:
          path: ~/fw-AC79_AIoT_SDK
          key: ac79-sdk-V1.2.1_2023-12-13

      - name: Descargar SDK AC79
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK; sleep 20
          done
          test -f ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot

      - name: Compilar
        env:
          FELUCCA_SLICE: '0'   # sin el motor SLICE ni su BREAK: espacio para el acordeón
          FELUCCA_UAC: '1'     # audio por USB (hay espacio desde que se quitaron los motores)
        run: ./build.sh

      - name: Lo que más ocupa (top 120 símbolos)
        run: |
          ~/.jieli/toolchain/common/bin/objdump -t build/felucca.elf \
            | awk 'NF>=5 && $(NF-2) !~ /\*/ {printf "%d %s %s\n", strtonum("0x"$(NF-1)), $(NF-2), $NF}' \
            | sort -rn > build/simbolos.txt; grep " .text " build/simbolos.txt; awk '$2==".text"{t+=$1} END{print "TEXT total", t}' build/simbolos.txt

      - name: Guardar firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            build/felucca.fwsc
            build/felucca.bin
            build/loader/ota.bin
            build/simbolos.txt
          if-no-files-found: error

      - name: Armar el instalador web
        run: python3 web/make_site.py build/felucca.fwsc "0.1-${GITHUB_SHA::7}" site

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  publicar:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}webapp/installer/
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
